.ac-content{padding-bottom:35px}
.ac-intro{position:relative;border:1px solid #622a29;border-radius:15px;min-height:160px;overflow:hidden;background:#0a0506;margin:15px 0 24px;display:flex;align-items:center}
.ac-intro>img{position:absolute;right:0;top:0;width:60%;height:100%;object-fit:cover;opacity:.75}

.ac-intro>div{z-index:1;position:relative;max-width:74%;padding:20px 16px}.ac-intro h2{font:700 clamp(20px,5.5vw,32px)/1.12 Georgia,serif;color:#fff0df;margin:6px 0}.ac-intro p{font-size:12px;line-height:1.5;color:#e9c9b7}

.ac-routes{display:grid;gap:12px}

{id:'intro',level:['Introducción','Introduction'],title:['Introducción al Rope Bondage','Introduction to Rope Bondage'],description:['Cuidados, consentimiento, materiales, precauciones y evaluaciones teóricas.','Care, consent, materials, precautions and knowledge checks.'],photo:'./academy-basic.webp'},
{id:'basic',level:['Básico','Beginner'],title:['Nudos esenciales: práctica visual','Essential knots: visual practice'],description:['Siete nudos básicos: simple y ocho con imágenes paso a paso; llano, as de guía, ballestrinque, vuelta de escota y margarita en preparación.','Seven beginner knots: overhand and figure eight with step-by-step images; square knot, bowline, clove hitch, sheet bend and sheepshank in preparation.'],photo:'./academy-basic.webp'},

];
const basicLessons=[{"es":"Bienvenida al arte de la cuerda","en":"Welcome to rope art","p_es":["El rope bondage puede estudiarse como práctica artística y relacional entre personas adultas. La estética nunca debe estar por encima del bienestar de quienes participan.","Esta introducción aborda conceptos, cultura y decisiones responsables. No sustituye una formación práctica presencial ni enseña suspensiones o inmovilizaciones."],"p_en":["Rope bondage can be studied as an artistic and relational practice between consenting adults. Aesthetics must never outrank the well-being of the people involved.","This introduction covers concepts, culture, and responsible choices. It does not replace in-person practical training or teach suspension or restraint techniques."],"q_es":"¿Qué te gustaría aprender y por qué?","q_en":"What would you like to learn and why?"},{"es":"Consentimiento y límites","en":"Consent and boundaries","p_es":["El consentimiento debe ser libre, informado, específico y reversible. Antes de cualquier actividad se conversa sobre lo que sí se desea, lo que no y lo que queda fuera de discusión.","El silencio no significa aceptación. Si alguien duda, cambia de opinión o pide parar, se detiene todo sin cuestionar ni presionar. Ninguna persona bajo efectos que afecten su capacidad de decisión debe participar."],"p_en":["Consent must be freely given, informed, specific, and reversible. Before any activity, talk about what is wanted, unwanted, or off limits.","Silence is not consent. If someone hesitates, changes their mind, or asks to stop, the activity stops without pressure. No one whose decision-making is impaired should participate."],"q_es":"¿Cómo expresarías un límite de forma clara?","q_en":"How would you clearly communicate a boundary?"},{"es":"Comunicación y señales de pausa","en":"Communication and stop signals","p_es":["Acordar palabras sencillas para continuar, hacer una pausa o detenerse es una forma básica de cuidado. También conviene pactar señales no verbales por si hablar resulta difícil.","Durante cualquier interacción es importante preguntar cómo se siente la otra persona y escuchar la respuesta sin anticiparla. Ante cualquier señal de malestar, se interrumpe la actividad."],"p_en":["Agreeing on simple words for continuing, pausing, and stopping supports safer communication. Agree on nonverbal signals too, in case speaking becomes difficult.","Check in during any interaction and listen without assuming the response. Stop the activity at any sign of distress."],"q_es":"¿Qué señal usarías para pedir una pausa?","q_en":"Which signal would you use to request a pause?"},{"es":"Materiales, higiene y espacio","en":"Materials, hygiene, and space","p_es":["Las fibras, el grosor, la limpieza y el estado de las cuerdas influyen en su tacto y desgaste. Un material deteriorado o de procedencia desconocida no debe utilizarse sobre una persona.","El espacio debe permitir moverse sin obstáculos y contar con una salida accesible. Para aprendizaje práctico, busca orientación profesional y ten previsto cómo interrumpir cualquier actividad de inmediato."],"p_en":["Fiber, thickness, cleanliness, and rope condition affect feel and wear. Damaged or unknown materials should not be used on another person.","The space should have clear movement paths and accessible exits. Seek qualified guidance for any hands-on learning and plan how to stop an activity immediately."],"q_es":"¿Qué revisarías primero al preparar un espacio?","q_en":"What would you check first when preparing a space?"},{"es":"Riesgos físicos y señales de alarma","en":"Physical risks and warning signs","p_es":["La presión sobre nervios y vasos sanguíneos puede causar lesiones incluso cuando no hay dolor intenso. Hormigueo, entumecimiento, debilidad, cambios de color, mareo o dificultad respiratoria son señales para detenerse.","Las suspensiones y técnicas que soportan peso tienen riesgos elevados y requieren instrucción práctica especializada. Si aparecen síntomas intensos, persistentes o dificultad para respirar, busca atención médica urgente."],"p_en":["Pressure on nerves and blood vessels can injure even without intense pain. Tingling, numbness, weakness, color changes, dizziness, or breathing difficulty are signals to stop.","Suspension and weight-bearing techniques carry serious risks and require qualified hands-on instruction. Seek urgent medical attention for severe or persistent symptoms or trouble breathing."],"q_es":"¿Por qué no basta con preguntar si algo duele?","q_en":"Why is asking only about pain insufficient?"},{"es":"Planificación y expectativas","en":"Planning and expectations","p_es":["Antes de compartir una experiencia, conviene hablar de intención, límites, necesidades de salud relevantes, tiempo disponible y expectativas emocionales. Cada persona debe sentirse libre de no participar.","No hace falta avanzar hacia técnicas complejas. Elegir observación, teoría, fotografía no invasiva o diálogo puede ser una forma completa de explorar la dimensión artística de la cuerda."],"p_en":["Before sharing an experience, discuss intentions, boundaries, relevant health needs, available time, and emotional expectations. Everyone must feel free to decline.","You do not need to progress to complex techniques. Observation, theory, non-invasive photography, or discussion can be complete ways of exploring rope as an art form."],"q_es":"¿Qué conversación sería esencial antes de empezar?","q_en":"What conversation is essential before starting?"},{"es":"Cuidado posterior y bienestar","en":"Aftercare and well-being","p_es":["Tras cualquier experiencia íntima o emocionalmente intensa, es útil conversar sobre cómo se sintieron las personas, ofrecer un espacio tranquilo y respetar la necesidad individual de descanso o distancia.","El cuidado posterior no reemplaza la atención médica. Si aparecen molestias persistentes, pérdida de sensibilidad, debilidad o cualquier otro síntoma preocupante, solicita valoración profesional."],"p_en":["After an intimate or emotionally intense experience, talk about how everyone felt, offer a calm environment, and respect individual needs for rest or space.","Aftercare is not a substitute for medical care. Persistent discomfort, loss of feeling, weakness, or other concerning symptoms should be evaluated by a professional."],"q_es":"¿Qué forma de cuidado te gustaría recibir después?","q_en":"What kind of aftercare would you want to receive?"},{"es":"Ética y próximos pasos","en":"Ethics and next steps","p_es":["Las fotografías, historias y datos personales se comparten solo con permiso explícito. La intimidad y la privacidad no son premios, son derechos. Respetar límites también implica no presionar para publicar contenido.","Para continuar, busca docentes con experiencia demostrable en seguridad, primeros auxilios y consentimiento, y revisa sus referencias. La Academia seguirá incorporando material educativo a medida que sea revisado."],"p_en":["Photos, stories, and personal details should only be shared with explicit permission. Privacy is a right, never a reward. Respecting boundaries also means not pressuring anyone to post.","To continue learning, look for instructors with demonstrable experience in safety, first aid, and consent, and check references. The Academy will add more reviewed educational material over time."],"q_es":"¿Qué tres valores deberían guiar tu aprendizaje?","q_en":"Which three values should guide your learning?"}];

const legacyAcademyModules={basic:basicLessons.map((l,i)=>Object.assign({},l,[{"q_es":"¿Qué es prioritario en esta práctica?","q_en":"What is the main priority?","options_es":["Sin necesidad de preguntar.","El bienestar y autonomía de las personas.","Haciéndolo más complejo."],"options_en":["Without asking anyone.","People's well-being and autonomy.","Making it more complex."],"correct":1},{"q_es":"¿Qué característica tiene el consentimiento?","q_en":"What is a property of consent?","options_es":["Sin necesidad de preguntar.","Puede retirarse en cualquier momento.","Haciéndolo más complejo."],"options_en":["Without asking anyone.","It can be withdrawn at any time.","Making it more complex."],"correct":1},{"q_es":"¿Qué haces si alguien pide una pausa?","q_en":"What should you do when someone asks for a pause?","options_es":["Sin necesidad de preguntar.","Detenerte y escuchar sin presionar.","Haciéndolo más complejo."],"options_en":["Without asking anyone.","Stop and listen without pressure.","Making it more complex."],"correct":1},{"q_es":"¿Qué se revisa en una cuerda?","q_en":"What should you check in a rope?","options_es":["Sin necesidad de preguntar.","Su estado, limpieza y desgaste.","Haciéndolo más complejo."],"options_en":["Without asking anyone.","Its condition, cleanliness, and wear.","Making it more complex."],"correct":1},{"q_es":"¿Qué síntoma requiere detenerse?","q_en":"Which symptom means stop?","options_es":["Sin necesidad de preguntar.","Hormigueo o pérdida de sensibilidad.","Haciéndolo más complejo."],"options_en":["Without asking anyone.","Tingling or loss of sensation.","Making it more complex."],"correct":1},{"q_es":"¿Cómo comienzas a planear una experiencia?","q_en":"How do you begin planning?","options_es":["Sin necesidad de preguntar.","Conversando expectativas y límites.","Haciéndolo más complejo."],"options_en":["Without asking anyone.","By discussing expectations and boundaries.","Making it more complex."],"correct":1},{"q_es":"¿El cuidado posterior reemplaza atención médica?","q_en":"Does aftercare replace medical care?","options_es":["Sin necesidad de preguntar.","No; los síntomas preocupantes necesitan valoración.","Haciéndolo más complejo."],"options_en":["Without asking anyone.","No; concerning symptoms require evaluation.","Making it more complex."],"correct":1},{"q_es":"¿Cuándo se comparten fotos de otra persona?","q_en":"When can you share someone's photos?","options_es":["Sin necesidad de preguntar.","Solo con permiso explícito.","Haciéndolo más complejo."],"options_en":["Without asking anyone.","Only with explicit permission.","Making it more complex."],"correct":1}][i])).concat([{"es":"Partes de una cuerda","en":"Parts of a rope","p_es":["Identifica el cabo (extremo), el seno (curva), la vuelta y el cruce sobre una cuerda suelta y apoyada en una mesa. El vocabulario permite entender las imágenes con mayor precisión.","Separa los dos extremos y observa dónde pasa una parte por encima de otra. No pruebes diseños en personas ni los sometas a cargas."],"p_en":["Identify the end, bight, turn, and crossing with a loose rope laid on a table. These terms make diagrams easier to understand.","Separate both ends and observe which strand goes over and which goes under. Do not test shapes on people or under loads."],"q_es":"¿Qué significa seno en este contexto?","q_en":"What does bight mean here?","options_es":["No es necesario verificar los riesgos.","Una curva formada por la propia cuerda.","Avanzar sin consultar a nadie."],"options_en":["There is no need to check risks.","A bend made in the rope.","Proceed without asking anyone."],"correct":1},{"es":"Nudo simple: lectura visual","en":"Overhand knot: visual literacy","p_es":["El nudo simple o de tope forma una curva y un cruce de cuerda sobre sí misma. Observa la forma del lazo y la posición de los extremos sobre una superficie plana.","En esta lección el objetivo es reconocer la geometría, no usar el nudo como amarre corporal, anclaje o punto de suspensión. Compara una cuerda suelta con un nudo ya terminado."],"p_en":["An overhand or stopper knot uses a turn and a crossing. Observe the loop and the ends on a flat surface.","This lesson teaches visual identification, not use as body restraint, anchor, or suspension point. Compare loose rope with a finished knot."],"q_es":"¿Dónde se estudia el nudo en esta lección?","q_en":"Where is the knot studied in this lesson?","options_es":["No es necesario verificar los riesgos.","Sobre una mesa, sin aplicar carga.","Avanzar sin consultar a nadie."],"options_en":["There is no need to check risks.","On a table without loading it.","Proceed without asking anyone."],"correct":1},{"es":"Nudo de ocho: recorrido y cruces","en":"Figure-eight knot: form and crossings","p_es":["El nudo de ocho recibe su nombre por su silueta. Identifica visualmente las dos curvas y el recorrido del cabo, sin confundir una foto bonita con una comprobación técnica.","Los diagramas de la Academia son ilustrativos. No certifican resistencia ni sustituyen el aprendizaje supervisado de aplicaciones prácticas."],"p_en":["The figure-eight knot is named for its outline. Identify two curved sections and the strand's path without confusing an attractive photo for technical verification.","Academy diagrams are illustrative. They do not certify strength or replace supervised hands-on instruction."],"q_es":"¿Una fotografía demuestra que un nudo soporta peso?","q_en":"Does a photo prove a knot can bear weight?","options_es":["No es necesario verificar los riesgos.","No; hace falta evaluación y formación específicas.","Avanzar sin consultar a nadie."],"options_en":["There is no need to check risks.","No; proper assessment and training are needed.","Proceed without asking anyone."],"correct":1},{"es":"Nudos decorativos: límites de uso","en":"Decorative knots: limitations","p_es":["Un nudo llano y un nudo de alondra pueden aparecer en diseños decorativos. Sus variantes pueden cambiar de comportamiento con el material y la dirección de la fuerza.","Compara sus formas en una cuerda apoyada sobre un objeto inerte. No los interpretes como sistemas de sujeción personal o de rescate."],"p_en":["A reef knot and lark's-head knot may appear in decorative designs. Their behavior depends on materials and force direction.","Compare their appearance on an inert object. Do not treat them as restraint or rescue systems."],"q_es":"¿Qué cambia el comportamiento de un nudo?","q_en":"What affects knot behavior?","options_es":["No es necesario verificar los riesgos.","El material, la configuración y la dirección de la fuerza.","Avanzar sin consultar a nadie."],"options_en":["There is no need to check risks.","Material, configuration, and direction of force.","Proceed without asking anyone."],"correct":1}]),middle:[{"es":"Planificación de patrones","en":"Planning rope patterns","p_es":["Un diseño de nivel intermedio requiere prever trayectoria, simetría, cruces y espacio de trabajo. Empieza con bocetos sobre papel y cuerda suelta.","Usa solamente objetos inertes para estudiar distribución y fotografía. No conviertas un patrón ilustrativo en una técnica de inmovilización corporal."],"p_en":["Intermediate designs require planning strand direction, symmetry, crossings, and workspace. Start with paper sketches and loose rope.","Use inert objects only when exploring distribution and photography. Do not turn an illustrative pattern into body restraint."],"q_es":"¿Dónde comienza un diseño responsable?","q_en":"Where does responsible design begin?","options_es":["No es necesario verificar los riesgos.","En el boceto y la evaluación de límites.","Avanzar sin consultar a nadie."],"options_en":["There is no need to check risks.","With a sketch and boundaries assessment.","Proceed without asking anyone."],"correct":1},{"es":"Nudos dobles y variaciones","en":"Double knots and variations","p_es":["Compara visualmente dos nudos consecutivos con un nudo simple. Observa cuántos cruces se forman y cuánto material consume cada opción.","Más vueltas no garantizan mayor seguridad. Documenta las diferencias en dibujos o fotos de cuerda no cargada."],"p_en":["Compare two consecutive knots with one simple knot. Observe the crossings and the amount of rope used.","More turns do not guarantee greater safety. Record differences using sketches or unloaded rope photographs."],"q_es":"¿Más vueltas garantizan una sujeción segura?","q_en":"Do more turns guarantee safe restraint?","options_es":["No es necesario verificar los riesgos.","No; la seguridad no depende solo del número de vueltas.","Avanzar sin consultar a nadie."],"options_en":["There is no need to check risks.","No; safety does not depend on turns alone.","Proceed without asking anyone."],"correct":1},{"es":"Cruces y lectura del recorrido","en":"Reading crossings and rope paths","p_es":["En imágenes complejas, sigue un solo tramo de cuerda desde su extremo hasta la siguiente curva. Distingue claramente los pasos por delante y por detrás.","Utiliza un esquema con dos colores para comprender qué segmentos se superponen. Es un ejercicio gráfico, no un tutorial para amarrar a una persona."],"p_en":["In complex images, follow one strand from an end to its next curve. Distinguish over- and under-crossings.","Use two colors in a sketch to distinguish overlapping segments. This is a drawing exercise, not a body-tying tutorial."],"q_es":"¿Qué conviene seguir primero en una imagen compleja?","q_en":"What should you track first in a complex image?","options_es":["No es necesario verificar los riesgos.","El recorrido de un solo tramo de cuerda.","Avanzar sin consultar a nadie."],"options_en":["There is no need to check risks.","The path of one rope strand.","Proceed without asking anyone."],"correct":1},{"es":"Fricción y puntos de contacto","en":"Friction and contact points","p_es":["El tipo de fibra, la textura y el ángulo de contacto cambian cómo se desliza o frena la cuerda. Por eso una forma no se comporta igual en todos los materiales.","Estudia estos principios a nivel conceptual. No hagas ensayos de cargas, presión sobre la piel ni suspensión por cuenta propia."],"p_en":["Fiber type, texture, and contact angle change how rope slides or grips. A shape behaves differently across materials.","Study these principles conceptually. Do not self-test loads, pressure on skin, or suspensions."],"q_es":"¿Qué puede cambiar la fricción?","q_en":"What can change friction?","options_es":["No es necesario verificar los riesgos.","La textura, el material y los ángulos.","Avanzar sin consultar a nadie."],"options_en":["There is no need to check risks.","Texture, materials, and angles.","Proceed without asking anyone."],"correct":1},{"es":"Composición decorativa no portante","en":"Non-load-bearing decorative design","p_es":["Las tramas pueden combinarse visualmente sobre tablas, maniquíes rígidos o soportes sin carga. En fotografía importa que los cruces se distingan con claridad.","Evita presentar una composición artística como si fuera un equipo de seguridad. Indica cuándo una imagen solo ilustra la estructura."],"p_en":["Patterns can be arranged on boards, rigid mannequins, or non-load-bearing displays. Clear crossings are essential in photos.","Never present artwork as safety equipment. Label images when they only illustrate structure."],"q_es":"¿Qué debe aclarar una foto decorativa?","q_en":"What should a decorative photo clarify?","options_es":["No es necesario verificar los riesgos.","Que no certifica seguridad ni resistencia.","Avanzar sin consultar a nadie."],"options_en":["There is no need to check risks.","That it does not certify safety or strength.","Proceed without asking anyone."],"correct":1},{"es":"Comunicación durante una sesión","en":"Communication during a session","p_es":["Una experiencia más larga necesita pausas previstas, límites actualizados y señales de parada fáciles de recordar. El consentimiento se comprueba durante todo el tiempo.","Ante fatiga, ansiedad, confusión o cualquier síntoma físico, se interrumpe la actividad. La comodidad no se deduce del silencio."],"p_en":["Longer experiences require planned breaks, updated boundaries, and clear stop signals. Consent must be ongoing.","Stop at fatigue, anxiety, confusion, or any physical symptoms. Silence never demonstrates comfort."],"q_es":"¿Cuándo se revisa el consentimiento?","q_en":"When should consent be checked?","options_es":["No es necesario verificar los riesgos.","Antes y durante toda la experiencia.","Avanzar sin consultar a nadie."],"options_en":["There is no need to check risks.","Before and throughout an experience.","Proceed without asking anyone."],"correct":1},{"es":"Evaluación de un diseño","en":"Evaluating a design","p_es":["Revisa la legibilidad visual, el material, las preguntas pendientes y los límites de aplicación. Separa lo que puedes observar de lo que necesita una prueba supervisada.","Una forma fotogénica no garantiza resultados repetibles. La supervisión de una persona cualificada es imprescindible para prácticas con el cuerpo."],"p_en":["Review visual clarity, materials, unanswered questions, and limits of application. Separate observation from supervised testing.","A photogenic shape does not ensure repeatable results. Qualified supervision is essential for body-based practices."],"q_es":"¿Qué no se deduce de una buena foto?","q_en":"What can't be inferred from a good photo?","options_es":["No es necesario verificar los riesgos.","Que la estructura sea segura para utilizarse.","Avanzar sin consultar a nadie."],"options_en":["There is no need to check risks.","That the structure is safe to use.","Proceed without asking anyone."],"correct":1},{"es":"Repaso intermedio","en":"Intermediate review","p_es":["Este nivel reúne observación de nudos, análisis de cruces y decisiones responsables. Vuelve a los ejemplos anteriores y comprueba que puedes explicar sus limitaciones.","La progresión no da permiso para improvisar amarres restrictivos. Busca un instructor con experiencia comprobable antes de una práctica presencial."],"p_en":["This level combines knot observation, crossing analysis, and responsible decisions. Review examples and explain their limits.","Progress does not make improvising restrictive ties acceptable. Seek a qualified instructor before hands-on practice."],"q_es":"¿Qué acredita esta ruta digital?","q_en":"What does this digital path certify?","options_es":["No es necesario verificar los riesgos.","Comprensión conceptual, no competencia práctica.","Avanzar sin consultar a nadie."],"options_en":["There is no need to check risks.","Conceptual understanding, not hands-on competence.","Proceed without asking anyone."],"correct":1}],advanced:[{"es":"Cómo leer diseños complejos","en":"Reading complex patterns","p_es":["Un diseño avanzado puede tener numerosos cruces, capas y cambios de dirección. Aprende a separar visualmente las secciones y anotar los puntos que requieren evaluación.","No deduzcas instrucciones prácticas de una sola foto. Los patrones sobre el cuerpo necesitan evaluación individual y enseñanza presencial."],"p_en":["Advanced designs may involve many crossings, layers, and direction changes. Learn to separate sections visually and mark evaluation points.","Do not infer hands-on instructions from one photograph. Body-based patterns need individual assessment and in-person training."],"q_es":"¿Qué falta en una fotografía de un diseño complejo?","q_en":"What is missing from a complex-design photo?","options_es":["No es necesario verificar los riesgos.","Información suficiente para verificar su comportamiento.","Avanzar sin consultar a nadie."],"options_en":["There is no need to check risks.","Enough information to verify its behavior.","Proceed without asking anyone."],"correct":1},{"es":"Anatomía y zonas vulnerables","en":"Anatomy and vulnerable areas","p_es":["Los nervios y vasos sanguíneos pueden sufrir presión y daño aun sin dolor intenso. Cambios de color, hormigueo, entumecimiento, debilidad o malestar requieren detener la actividad.","La evaluación del riesgo corporal exige conocimientos especializados. No utilices este texto para decidir dónde aplicar presión o restricciones."],"p_en":["Nerves and blood vessels can be injured by pressure even without severe pain. Color changes, tingling, numbness, weakness, or distress mean stop.","Evaluating physical risk requires specialist knowledge. This text does not identify safe sites for pressure or restraint."],"q_es":"¿La ausencia de dolor descarta una lesión?","q_en":"Does no pain rule out injury?","options_es":["No es necesario verificar los riesgos.","No; pueden existir señales neurológicas o circulatorias.","Avanzar sin consultar a nadie."],"options_en":["There is no need to check risks.","No; neurological or circulatory signs can occur.","Proceed without asking anyone."],"correct":1},{"es":"Suspensión: riesgos y límites","en":"Suspension: risks and boundaries","p_es":["La suspensión coloca el peso corporal sobre sistemas que pueden fallar y producir lesiones graves. Por eso no incluimos instrucciones de montaje, elevación ni puntos de anclaje.","Este tema es exclusivamente de identificación de riesgos. Si alguien desea formarse en suspensión, necesita entrenamiento presencial especializado, práctica supervisada y planificación de emergencias."],"p_en":["Suspension puts body weight on systems that can fail and cause severe injury. That is why no rigging, lifting, or anchor instructions are provided.","This topic is solely about recognizing risks. Suspension requires specialist in-person training, supervision, and emergency planning."],"q_es":"¿Puede aprenderse suspensión solo con fotos de una app?","q_en":"Can suspension be learned from app photos alone?","options_es":["No es necesario verificar los riesgos.","No; requiere formación presencial especializada.","Avanzar sin consultar a nadie."],"options_en":["There is no need to check risks.","No; it requires specialist in-person instruction.","Proceed without asking anyone."],"correct":1},{"es":"Equipos y supervisión profesional","en":"Equipment and professional supervision","p_es":["Antes de formación avanzada, investiga la experiencia real del docente, la atención a emergencias y las prácticas de consentimiento. Pregunta por sus protocolos de interrupción.","No confíes en afirmaciones como «este nudo nunca falla». Los sistemas de carga requieren evaluación profesional adecuada al contexto."],"p_en":["Before advanced training, evaluate instructor experience, emergency response readiness, and consent procedures. Ask about stop protocols.","Do not trust claims such as 'this knot never fails.' Load-bearing systems need proper professional assessment."],"q_es":"¿Qué cualidad debe demostrar un docente avanzado?","q_en":"What must an advanced instructor demonstrate?","options_es":["No es necesario verificar los riesgos.","Experiencia verificable en seguridad y respuesta a emergencias.","Avanzar sin consultar a nadie."],"options_en":["There is no need to check risks.","Verifiable safety and emergency-response experience.","Proceed without asking anyone."],"correct":1},{"es":"Plan de emergencia y salida","en":"Emergency planning and exit","p_es":["Para cualquier actividad con riesgos físicos, deben existir criterios claros para parar y buscar ayuda. Dificultad respiratoria, pérdida de conciencia o síntomas persistentes requieren atención urgente.","Los planes de emergencia y las herramientas apropiadas deben revisarse en formación presencial. Una aplicación no puede intervenir en una situación real."],"p_en":["Any activity with physical risks needs clear rules for stopping and seeking help. Trouble breathing, loss of consciousness, or persistent symptoms require urgent care.","Emergency plans and suitable equipment must be reviewed during in-person training. An app cannot intervene in an emergency."],"q_es":"¿Qué hacer ante dificultad respiratoria?","q_en":"What should you do if breathing becomes difficult?","options_es":["No es necesario verificar los riesgos.","Detener la actividad y solicitar ayuda urgente.","Avanzar sin consultar a nadie."],"options_en":["There is no need to check risks.","Stop the activity and seek urgent help.","Proceed without asking anyone."],"correct":1},{"es":"Consenso, roles y poder","en":"Consent, roles, and power","p_es":["La experiencia previa o el estatus de una persona no reemplazan el consentimiento. La conversación debe permitir rechazar solicitudes sin penalizaciones.","Incluye expectativas emocionales, privacidad, bienestar posterior y límites que no están sujetos a negociación."],"p_en":["Experience or status never replaces consent. People must be able to refuse without consequences.","Discuss emotional expectations, privacy, aftercare, and non-negotiable boundaries."],"q_es":"¿El prestigio sustituye el consentimiento?","q_en":"Does experience or reputation replace consent?","options_es":["No es necesario verificar los riesgos.","No; debe existir consentimiento libre y continuo.","Avanzar sin consultar a nadie."],"options_en":["There is no need to check risks.","No; consent must remain free and ongoing.","Proceed without asking anyone."],"correct":1},{"es":"Registro visual y privacidad","en":"Images and privacy","p_es":["Cualquier foto o video requiere permiso explícito y concreto de todas las personas identificables. Explica dónde se guardará y quién tendrá acceso.","El permiso para participar no implica permiso para publicar imágenes. Respetar el consentimiento incluye retirar material si se acordó hacerlo."],"p_en":["Every photo or video requires explicit, specific permission from identifiable participants. Clarify storage and access.","Consent to participate does not imply consent to publish. Respecting consent includes removing material when agreed."],"q_es":"¿Participar significa consentir una publicación?","q_en":"Does participating mean consenting to a post?","options_es":["No es necesario verificar los riesgos.","No; la publicación necesita permiso aparte.","Avanzar sin consultar a nadie."],"options_en":["There is no need to check risks.","No; posting requires separate permission.","Proceed without asking anyone."],"correct":1},{"es":"Evaluación final y próximos pasos","en":"Final assessment and next steps","p_es":["Distingue lo aprendido en teoría de las habilidades que necesitan observación y corrección presencial. Resume tus preguntas antes de asistir a un curso especializado.","Esta Academia ofrece contenidos conceptuales; completar lecturas no constituye una certificación ni acredita práctica avanzada."],"p_en":["Distinguish theory learned online from skills that require in-person observation and correction. Collect questions before specialist training.","The Academy provides conceptual resources; completing readings is neither certification nor proof of advanced practical ability."],"q_es":"¿Qué significa completar esta ruta?","q_en":"What does completing this path mean?","options_es":["No es necesario verificar los riesgos.","Haber estudiado teoría, no disponer de una certificación.","Avanzar sin consultar a nadie."],"options_en":["There is no need to check risks.","Studying theory, not holding a qualification.","Proceed without asking anyone."],"correct":1}]};

{"es":"Ballestrinque","en":"Clove hitch","kind":"practical","desc_es":"Tres pasos sobre un poste de práctica. Reconoce las dos vueltas y el cruce central.","desc_en":"Three steps on a practice post. Identify the two turns and central crossing.","steps_es":["Rodea el poste con el cabo libre y crúzalo por encima del tramo largo.","Da una segunda vuelta y mete el cabo por debajo del cruce diagonal, como muestra la imagen.","Acomoda las dos vueltas y tira suavemente de los extremos para ver el nudo terminado."],"steps_en":["Take the free end around the post and cross over the standing part.","Go around again and tuck the free end beneath the diagonal crossing, as shown.","Dress both turns and gently pull the ends to inspect the finished hitch."],"referenceImage":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAAMCAgMCAgMDAwMEAwMEBQgFBQQEBQoHBwYIDAoMDAsKCwsNDhIQDQ4RDgsLEBYQERMUFRUVDA8XGBYUGBIUFRT/2wBDAQMEBAUEBQkFBQkUDQsNFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBT/wAARCAYAArMDASIAAhEBAxEB/8QAHgABAAEEAwEBAAAAAAAAAAAAAAgFBgcJAQMEAgr/xABwEAABAwMCAwMFBg0NCgoHBQkBAAIDBAURBgcSITEIE0EUIlFhcQkZMlaBlRUWI0JSU5GUobHR1OIXMzhiZHJ0kqOywdLTGCQ0NVd1gpaztCU3Q1RzhZOixOEmJzZHVcLwREZjZXaDhMM5RSil8bX/xAAcAQEAAQUBAQAAAAAAAAAAAAAAAQIDBAUGBwj/xAA+EQACAQMDAgMFBgUDAwUBAQAAAQIDBBEFEiExUQYTQSIyM2FxFBVSgZGhI0KxwdEHNOEWU/AkQ2KS8XLS/9oADAMBAAIRAxEAPwC const academyProgressKey='kizuna-rope-learning-v2';
function readAcademyProgress(){try{
 const found=localStorage.getItem(academyProgressKey);
 if(found){const o=JSON.parse(found);return o&&typeof o==='object'?o:{}}
 const old=JSON.parse(localStorage.getItem('kizuna-rope-learning-v1')||'{}');
 const basic=Array.isArray(old.basic)?old.basic:[];
 const middle=Array.isArray(old.middle)?old.middle:[];
 const advanced=Array.isArray(old.advanced)?old.advanced:[];
 const result={
   intro:[...basic.filter(i=>i>=0&&i<8),...middle.map(i=>i+8),...advanced.map(i=>i+8+legacyAcademyModules.middle.length)],
   basic:basic.filter(i=>i===9||i===10).map(i=>i-9),
   middle:[],advanced:[]
 };
 localStorage.setItem(academyProgressKey,JSON.stringify(result));return result;
 }catch{return {intro:[],basic:[],middle:[],advanced:[]}}}
const academyProgress=readAcademyProgress();
function academyDone(level,idx){return Array.isArray(academyProgress[level])&&academyProgress[level].includes(idx)}
function academyCount(level){return (academyModules[level]||[]).filter((_,i)=>academyDone(level,i)).length}
function academyPercent(level){const n=academyModules[level]?.length||1;return Math.round(academyCount(level)*100/n)}
function academyMark(level,idx){if(!academyModules[level]||!academyModules[level][idx])return;if(!Array.isArray(academyProgress[level]))academyProgress[level]=[];if(!academyProgress[level].includes(idx))academyProgress[level].push(idx);safeSet(academyProgressKey,JSON.stringify(academyProgress))}
function academyFirstPending(level){const a=academyModules[level]||[];return Math.max(0,a.findIndex((_,i)=>!academyDone(level,i)))||0}

leva ese extremo alrededor del tramo firme y luego en dirección contraria alrededor de la barra.","Coloca ambos tramos juntos y observa la simetría de las vueltas."],"en":["Choose an unloaded prop rod.","Pass the rope around the rod, leaving one end free.","Bring the end around the standing part and then the rod in the opposite direction.","Bring both strands together and inspect their symmetry."],"body_es":"Estudia esta vuelta en una argolla o barra decorativa colocada al lado de un maniquí, no sujeta a una persona ni aplicada sobre su cuerpo.","body_en":"Study this hitch on an inert prop ring or rod displayed beside a mannequin, not attached to a person."}];

function home(){return `<section class="hero"><div class="hero-person" role="img" aria-label="Mujer adulta en fotografía artística con cuerda roja"></div><div class="hero-copy"><h1>${tx('Club Privado','Private Club')}</h1><h2>${tx('Educación · Comunidad · Experiencias','Education · Community · Experiences')}</h2><p>${tx('El espacio internacional para aprender, conectar y vivir el arte de la cuerda de forma segura y consciente.','An international space to learn, connect and experience rope art with care and consent.')}</p><div class="hero-actions"><button class="btn" data-page="profile">${icon('lock')}${tx('Entrar al Club','Enter the Club')}</button><button class="btn ghost" data-action="preview">${icon('play')}${tx('Ver tráiler','Watch teaser')}</button></div></div></section>
<div class="modules">${sections.map(s=>`<button class="module" data-page="${s.id}"><span class="pict">${icon(s.icon)}</span><strong>${tr(s.label)}</strong><small>${tr(s.desc)}</small></button>`).join('')}</div>
<div class="content">${sectionTitle(tx('Cursos destacados','Featured courses'),tx('Ver todos','See all'),'academy')}<div class="course-grid">${courses.map(courseTile).join('')}</div>${sectionTitle(tx('Próximos eventos','Upcoming events'),tx('Ver calendario','View calendar'),'events')}${eventCard()}${ageNotice()}</div>`}
function pageHead(title,description){return `<div class="page-top"><button class="back" data-page="home">‹ ${tx('Volver al inicio','Back to home')}</button><h1>${title}</h1><p>${description}</p></div>`}

function academy(){
return pageHead(tx('Academia','Academy'),tx('Cuatro rutas para aprender de forma progresiva.','Four progressive learning routes.'))+
'<div class="content ac-content"><div class="ac-intro"><img src="./academy-basic.webp" alt="'+tx('Cuerda roja trenzada','Braided red rope')+'" loading="lazy"><div><span class="ac-eyebrow">THE ROPE CLUB</span><h2>'+tx('Cuatro secciones. Un camino claro.','Four sections. A clear path.')+'</h2><p>'+tx('Introducción para teoría y preguntas. Básico, Intermedio y Avanzado para las demostraciones prácticas.','Introduction for theory and questions. Beginner, Intermediate and Advanced for practical demonstrations.')+'</p></div></div><div class="ac-section"><h2>'+tx('Elige tu ruta','Choose your path')+'</h2><p>'+tx('Las lecciones disponibles muestran imágenes y pasos. Las que faltan aparecen marcadas en preparación.','Available lessons show photos and steps. Upcoming material is clearly marked in preparation.')+'</p></div><div class="ac-routes">'+courses.map(courseTile).join('')+'</div><div class="ac-note">'+tx('Las imágenes de nudos son ilustrativas. Las sujeciones corporales y suspensiones no se enseñan como ejercicios para realizar sin instructor.','Knot images are illustrative; Body restraints and suspensions are not taught as unsupervised exercises.')+'</div></div>';
}
function academyLessonRows(c){
 const lessons=academyModules[c.id]||[];
 return lessons.map((l,i)=>'<button class="ac-lesson-row" data-page="lesson" data-id="'+c.id+':'+i+'"><img src="'+((l.images&&l.images.length)?l.images[l.images.length-1]:c.photo)+'" alt="'+tx('Vista del nudo o material','Knot or materials preview')+'" loading="lazy"><span class="ac-row-content"><span class="ac-row-number">'+tx('Lección ','Lesson ')+(i+1)+'</span><strong>'+esc(academyTitle(l))+'</strong><small>'+(c.id==='intro'?tx('Lectura + pregunta de repaso','Reading + review question'):(l.kind==='preview'?tx('Imágenes y secuencia en preparación','Photos and sequence in production'):tx('Fotografías + cuatro pasos','Photos + four steps')))+'</small></span><span class="ac-row-end '+(academyDone(c.id,i)?'is-done':'')+'">'+(academyDone(c.id,i)?'✓':'›')+'</span></button>').join('');
}
function courseDetail(id){
 const c=courses.find(x=>x.id===id)||courses[0],total=academyModules[c.id].length,done=academyCount(c.id);
 const i=academyFirstPending(c.id);
 return '<div class="content ac-content"><button class="ac-back" data-page="academy">‹ '+tx('Volver a la Academia','Back to Academy')+'</button><div class="ac-course-hero"><img src="'+c.photo+'" alt="'+esc(tr(c.title))+'"><div class="ac-course-gradient"></div><div class="ac-course-copy"><span class="ac-level-tag">'+tx('Nivel ','Level ')+esc(tr(c.level))+'</span><h1>'+esc(tr(c.title))+'</h1><p>'+esc(tr(c.description))+'</p></div></div><div class="ac-course-summary"><span>'+total+' '+tx('lecciones','lessons')+'</span><span>'+done+'/'+total+' '+tx('completadas','completed')+'</span><span>'+academyPercent(c.id)+'%</span></div>'+academyProgressBar(c.id)+'<div class="ac-section"><h2>'+tx('Lecciones del curso','Course lessons')+'</h2><p>'+(c.id==='intro'?tx('Lecturas, precauciones y preguntas para comprobar lo aprendido.','Readings, precautions and review questions.'):tx('Abre una demostración. Las imágenes disponibles muestran un paso por fotografía; las demás secuencias están en preparación.','Open a demonstration. Available images show one step per photo; other sequences are in production.'))+'</p></div><div class="ac-lesson-list">'+academyLessonRows(c)+'</div>'+(academyModules[c.id].some(l=>l.kind!=='preview')?'<button class="ac-main-btn" data-page="lesson" data-id="'+c.id+':'+i+'">'+(done===total?tx('Repasar curso','Review course'):tx('Continuar curso','Continue course'))+' <span>›</span></button>':'<div class="kr-preparing">'+tx('Prácticas fotográficas en preparación','Photographic lessons in production')+'</div>')+'<div class="ac-note">'+(c.id==='advanced'?tx('Las demostraciones avanzadas están en preparación. Suspensiones y amarres corporales con carga requieren formación y supervisión presencial especializada.','Advanced demonstrations are in production. Suspensions and load-bearing body ties require qualified supervised training.'):tx('Las fotos explican formas visuales, no garantizan que un nudo sea seguro para aplicar fuerza o restringir a alguien.','Photos explain visual shapes; they do not establish a knot as safe for loading or restraint.'))+'</div></div>';
}
function practicalLessonView(c,idx,l,last,done){
 const es=state.lang==='es',isPreview=l.kind==='preview',name=academyTitle(l);
 let html='<div class="content ac-content kr-practice"><button class="ac-back" data-page="course" data-id="'+c.id+'">‹ '+tx('Volver al nivel','Back to level')+'</button><div class="ac-lesson-banner"><img src="'+c.photo+'" alt="'+tx('Fotografía de cuerda roja','Photograph of red rope')+'"><span class="ac-level-tag">'+tx('Nivel ','Level ')+esc(tr(c.level))+'</span></div><div class="ac-reading"><div class="ac-reading-count">'+tx('LECCIÓN ','LESSON ')+(idx+1)+' / '+academyModules[c.id].length+'</div><h1>'+esc(name)+'</h1><p class="ac-reading-intro">'+esc(es?l.desc_es:l.desc_en)+'</p>';
 if(isPreview){
 html+='<div class="kr-preview"><h2>'+tx('Secuencia fotográfica en preparación','Photo sequence in production')+'</h2><img src="'+c.photo+'" alt="'+tx('Referencia visual del nivel','Level visual reference')+'"><p>'+tx('Esta lección todavía no contiene una demostración técnica paso a paso revisada. No vamos a presentar dibujos inventados como si fueran instrucciones exactas.','This lesson does not yet contain a reviewed step-by-step technical demonstration. We will not present invented diagrams as exact instructions.')+'</p>'+(l.url?'':'')+'</div>';
 }else{
 const steps=es?l.steps_es:l.steps_en;
 html+='<div class="kr-practice-head"><h2>'+tx('Cómo hacerlo, paso a paso','Step-by-step instructions')+'</h2><p>'+tx('Cuerda suelta sobre una mesa, sin cargar peso ni amarrar a personas.','Unloaded rope on a table; no loading or restraining people.')+'</p></div><div class="kr-practice-grid">'+steps.map((step,j)=>'<figure class="kr-practice-step">'+(l.referenceImage?'<div style="background:white"><svg viewBox="'+l.crops[j].join(' ')+'" role="img" aria-label="'+tx('Paso ','Step ')+(j+1)+'" style="display:block;width:100%;height:auto"><image href="'+l.referenceImage+'" width="691" height="1536"/></svg></div>':'<div><img src="'+l.images[j]+'" alt="'+tx('Paso ','Step ')+(j+1)+': '+esc(step)+'" loading="'+(j>1?'lazy':'eager')+'"></div>')+'<figcaption><span>'+(j+1)+'</span>'+esc(step)+'</figcaption></figure>').join('')+'</div><div class="kr-photo-check">'+tx('Imágenes realistas de referencia. Observa la posición de los cabos y los cruces.','Realistic reference imagery. Observe the strand placement and crossings.')+'</div><div class="kr-decorative"><h2>'+tx('Integración en una composición decorativa','Use in decorative rope compositions')+'</h2><p>'+esc(es?l.body_es:l.body_en)+'</p></div>';
 }
 html+='</div><div class="ac-reading-footer"><button class="ac-secondary-btn" data-page="course" data-id="'+c.id+'">'+tx('Ver todas las lecciones','View all lessons')+'</button>'+(isPreview?'<span class="kr-preparing">'+tx('En preparación','In production')+'</span>':'<button class="ac-main-btn" data-action="academy-done" data-level="'+c.id+'" data-lesson="'+idx+'">'+(done?tx('✓ Completada','✓ Completed'):tx('Marcar práctica revisada','Mark as reviewed'))+'</button>')+'</div><div class="ac-note">'+tx('Contenido adulto y educativo. La formación práctica con restricciones corporales, presión sobre nervios o suspensión necesita supervisión especializada.','Adult educational content. Body restraints, nerve pressure and suspension require qualified hands-on supervision.')+'</div></div>';
 return html;

function academyLessonView(key){
 const [level,number]=String(key||'basic:0').split(':'),c=courses.find(x=>x.id===level)||courses[0],idx=Math.max(0,Math.min(Number(number)||0,academyModules[c.id].length-1)),lessons=academyModules[c.id],l=lessons[idx],p=academyText(l),choices=academyOptions(l)||[],last=idx===lessons.length-1,done=academyDone(c.id,idx);
 if(c.id!=='intro')return practicalLessonView(c,idx,l,last,done);
 return '<div class="content ac-content"><button class="ac-back" data-page="course" data-id="'+c.id+'">‹ '+tx('Volver al nivel','Back to level')+'</button><div class="ac-lesson-banner"><img src="'+c.photo+'" alt="'+tx('Fotografía de cuerda roja, ilustrativa','Illustrative red rope photograph')+'"><span class="ac-level-tag">'+tx('Nivel ','Level ')+esc(tr(c.level))+'</span></div><div class="ac-reading"><div class="ac-reading-count">'+tx('LECCIÓN ','LESSON ')+(idx+1)+' / '+lessons.length+'</div><h1>'+esc(academyTitle(l))+'</h1><p class="ac-reading-intro">'+tx('Lectura educativa con apoyo visual y revisión de conceptos.','Educational reading with visual support and concept review.')+'</p><div class="ac-photo-note">'+tx('Imagen ilustrativa: los cruces reales deben verificarse con un instructor, no solo con fotografías.','Illustrative image: actual crossings must be verified with an instructor, not only photographs.')+'</div>'+verifiedKnotGuide(c.id,idx)+p.map((para,i)=>'<p>'+esc(para)+'</p>').join('')+'<div class="ac-reflection"><strong>'+tx('Para reflexionar','Reflect')+'</strong><p>'+esc(state.lang==='es'?l.q_es:l.q_en)+'</p></div></div><div class="ac-quiz"><h2>'+tx('Comprueba lo aprendido','Check what you learned')+'</h2><p>'+esc(academyQuiz(l))+'</p><div class="ac-choices">'+choices.map((choice,j)=>'<button data-action="academy-answer" data-level="'+c.id+'" data-lesson="'+idx+'" data-choice="'+j+'">'+esc(choice)+'</button>').join('')+'</div><p class="ac-quiz-hint">'+(done?tx('✓ Lección completada en este dispositivo.','✓ Lesson completed on this device.'):tx('Elige la respuesta correcta para guardar tu avance.','Choose the right answer to save progress.'))+'</p></div><div class="ac-reading-footer"><button class="ac-secondary-btn" data-action="academy-done" data-level="'+c.id+'" data-lesson="'+idx+'">'+(done?'✓ '+tx('Completada','Completed'):tx('Marcar como leída','Mark as read'))+'</button>'+(last?'<button class="ac-main-btn" data-page="course" data-id="'+c.id+'">'+tx('Volver al curso','Back to course')+' ›</button>':'<button class="ac-main-btn" data-page="lesson" data-id="'+c.id+':'+(idx+1)+'">'+tx('Siguiente lección','Next lesson')+' ›</button>')+'</div><div class="ac-note">'+tx('Material educativo 18+. No sustituye clases presenciales, certificaciones ni evaluación de seguridad individual.','Adult educational material. Not a replacement for in-person training, certification, or individual safety assessments.')+'</div></div>';
}

function shop(){const products=[['🪢',tx('Cuerdas de práctica','Practice ropes'),tx('Catálogo de materiales previsto.','Planned materials catalog.')],['🧵',tx('Accesorios de cuidado','Care accessories'),tx('Información sobre almacenamiento y mantenimiento.','Storage and maintenance information.')],['📚',tx('Recursos educativos','Learning resources'),tx('Material bibliográfico y guías de estudio.','Books and study guides.')]];return `${pageHead(tx('Tienda','Shop'),tx('Un espacio futuro para materiales, accesorios y recursos especializados.','A future space for selected materials, accessories and resources.'))}<div class="content"><div class="cards-2">${products.map(p=>`<div class="shop-card"><div class="glyph">${p[0]}</div><h3>${p[1]}</h3><p class="muted">${p[2]}</p><span class="pill">${tx('Próximamente','Coming soon')}</span></div>`).join('')}</div><div class="alert">${tx('No hay catálogo comercial activo, precios, pedidos ni pagos en esta demostración.','No active commercial catalog, pricing, orders or payments in this demo.')}</div></div>`}
function vip(){return `${pageHead('Club VIP',tx('Un espacio de experiencias y beneficios futuros, diseñado para personas adultas.','Future experiences and benefits for adults.'))}<div class="content"><div class="panel"><h2>✦ ${tx('Membresía en preparación','Membership in preparation')}</h2><p>${tx('Contenido complementario, sesiones con especialistas y actividades exclusivas son ideas en desarrollo. Los beneficios se anunciarán cuando estén definidos.','Supplementary content, expert sessions and exclusive activities are concepts in development. Benefits will be published once defined.')}</p><span class="pill">18+</span><span class="pill">${tx('Sin cobros','No charges')}</span><div class="form-actions"><button class="btn ghost" data-page="profile">${tx('Crear perfil local','Create local profile')}</button></div></div></div>`}
function teachers(){return `${pageHead(tx('Instructores','Instructors'),tx('Los instructores deben ser autorizados por la administración antes de ofrecer cursos.','Instructors must be approved by the administrator before offering courses.'))}<div class="content"><div class="panel"><h2>${tx('Participar como instructor','Become an instructor')}</h2><p>${tx('La propuesta inicial es una comisión del 15 % por venta, pendiente de condiciones definitivas.','The preliminary proposal is a 15% commission per sale, subject to final terms.')}</p><form id="teacher-form"><label for="teacher-name">${tx('Nombre profesional','Professional name')}</label><input id="teacher-name" name="name" maxlength="70" required placeholder="${tx('Tu nombre','Your name')}"><label for="teacher-specialty">${tx('Especialidad','Specialty')}</label><input id="teacher-specialty" name="specialty" maxlength="110" required placeholder="${tx('Área de experiencia','Experience area')}"><label for="teacher-note">${tx('Breve presentación','Short introduction')}</label><textarea id="teacher-note" name="note" maxlength="600" required></textarea><button class="btn" type="submit">${tx('Guardar solicitud de prueba','Save demo application')}</button></form></div><div class="alert">${tx('Esta solicitud se guarda solo en este teléfono o navegador. No se envía al administrador ni implica aprobación.','This application is saved only on this device/browser. It is not sent to the administrator and does not imply approval.')}</div></div>`}
function profile(){const p=state.data.profile;if(!p)return `${pageHead(tx('Entrar al Club','Enter the Club'),tx('Crea un perfil de prueba para explorar la experiencia en tu dispositivo.','Create a demo profile to explore the experience on your device.'))}<div class="content"><div class="panel"><h2>${tx('Crear perfil local','Create local profile')}</h2><form id="profile-form"><label for="nickname">${tx('Nombre de usuario','Display name')}</label><input id="nickname" name="nickname" autocomplete="nickname" maxlength="35" required><label for="bio">${tx('Presentación','About you')}</label><textarea id="bio" name="bio" maxlength="320" placeholder="${tx('Cuéntanos sobre tus intereses artísticos','Share your artistic interests')}"></textarea><label for="avatar-file">${tx('Foto de perfil (opcional)','Profile photo (optional)')}</label><input id="avatar-file" name="photo" type="file" accept="image/png,image/jpeg,image/webp" /><label class="checkline"><input id="age" name="age" type="checkbox" required> ${tx('Confirmo que soy mayor de 18 años.','I confirm that I am over 18.')}</label><label class="checkline"><input id="consent" name="consent" type="checkbox" required> ${tx('Acepto las reglas de consentimiento, privacidad y respeto de la comunidad.','I agree to the community rules on consent, privacy and respect.')}</label><button class="btn" type="submit">${tx('Crear perfil de demostración','Create demo profile')}</button></form></div><div class="alert">${tx('No es una cuenta real. La información y fotos quedan guardadas solo en este navegador. Evita incluir datos sensibles.','This is not a real account. Info and photos remain on this browser only. Avoid sensitive information.')}</div></div>`;
return `${pageHead(tx('Mi perfil','My profile'),tx('Perfil local de demostración','Local demo profile'))}<div class="content"><div class="panel"><div class="profile-line"><div class="profile-circle">${p.photo?`<img src="${p.photo}" alt="${tx('Foto de perfil','Profile photo')}">`:esc(p.nickname.slice(0,2).toUpperCase())}</div><div><h2 style="margin:0 0 8px">${esc(p.nickname)}</h2><span class="pill">${tx('Perfil local','Local profile')}</span></div></div><p>${esc(p.bio||tx('Sin presentación','No bio yet'))}</p><p class="muted">${tx('Cursos guardados','Saved courses')}: ${state.data.favorites.length} · ${tx('Publicaciones','Posts')}: ${state.data.posts.filter(x=>x.author===p.nickname).length}</p><div class="form-actions"><button class="btn ghost" data-page="community">${tx('Ir a la comunidad','Go to community')}</button><button class="btn ghost" data-action="clear-profile">${tx('Borrar perfil local','Delete local profile')}</button></div></div></div>`}
function postForm(){return `<div class="panel"><h2>${tx('Nueva publicación','New post')}</h2><form id="post-form"><label for="post-body">${tx('¿Qué deseas compartir?','What would you like to share?')}</label><textarea name="body" id="post-body" maxlength="1000" required placeholder="${tx('Comparte ideas, arte o preguntas respetuosas…','Share ideas, art or respectful questions…')}"></textarea><label for="post-photo">${tx('Imagen opcional','Optional image')}</label><input name="photo" id="post-photo" type="file" accept="image/png,image/jpeg,image/webp"><label class="checkline"><input type="checkbox" name="rules" required>${tx('Esta publicación respeta los límites, consentimiento y privacidad de todas las personas.','This post respects everyone’s boundaries, consent, and privacy.')}</label><button class="btn" type="submit">${tx('Publicar en mi dispositivo','Post on my device')}</button></form><p class="muted" style="font:12px Arial,sans-serif">${tx('Tus publicaciones son visibles solo en este navegador, no para otras personas.','Posts appear only in this browser, not to other people.')}</p></div>`}
function community(){const p=state.data.profile;const posts=state.data.posts.filter(x=>!state.data.hidden.includes(x.id)).sort((a,b)=>b.time-a.time);return `${pageHead(tx('Comunidad','Community'),tx('Un lugar para compartir arte, ideas y preguntas con respeto.','A place to share art, ideas, and respectful questions.'))}<div class="content"><div class="alert">${tx('Modo de demostración: publicaciones, fotos y comentarios se guardan localmente. Todavía no hay una red social en línea ni moderación central.','Demo mode: posts, photos and comments are stored locally. There is no online social network or central moderation yet.')}</div>${p?postForm():`<div class="panel"><h2>${tx('Participa en la comunidad','Join the community')}</h2><p>${tx('Para publicar y comentar en el prototipo, primero crea tu perfil local de adulto.','To post and comment in the prototype, first create a local adult profile.')}</p><button class="btn" data-page="profile">${tx('Crear perfil','Create profile')}</button></div>`}${sectionTitle(tx('Publicaciones en este dispositivo','Posts on this device'))}${posts.length?posts.map(postHTML).join(''):`<div class="empty">${tx('Aún no hay publicaciones. Tu primera publicación abrirá esta sección.','No posts yet. Your first post will start this space.')}</div>`}</div>`}
function postHTML(post){const comments=Array.isArray(post.comments)?post.comments:[];return `<article class="post"><div class="post-head"><div><div class="post-author">${esc(post.author)}</div><div class="post-date">${new Date(post.time).toLocaleString(state.lang==='es'?'es-MX':'en-US')}</div></div><button class="btn ghost small" data-action="hide-post" data-id="${esc(post.id)}">${tx('Ocultar','Hide')}</button></div><p>${esc(post.body)}</p>${post.photo?`<img class="post-image" src="${post.photo}" alt="${tx('Imagen de publicación','Post image')}" loading="lazy">`:''}<div class="tag-row"><span class="pill">${tx('Publicación local','Local post')}</span><span class="pill">${comments.length} ${tx('comentarios','comments')}</span></div>${comments.map(c=>`<div class="comment"><b>${esc(c.author)}:</b> ${esc(c.text)}</div>`).join('')}${state.data.profile?`<form class="comment-input" data-post="${esc(post.id)}"><input name="comment" maxlength="350" required aria-label="${tx('Escribir comentario','Write comment')}" placeholder="${tx('Comentar…','Comment…')}"><button class="btn small" type="submit">${tx('Enviar','Send')}</button></form>`:''}</article>`}
function initial(){document.getElementById('menu-icon').innerHTML=icon('menu');document.getElementById('search-icon').innerHTML=icon('search');document.getElementById('profile-icon').innerHTML=icon('user');document.getElementById('app-shell').hidden=false;render();setTimeout(()=>{document.getElementById('splash')?.classList.add('fade')},1500);setTimeout(()=>{document.getElementById('splash')?.remove()},2100);if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});}
function render(){document.documentElement.lang=state.lang;document.querySelector('.language').textContent=state.lang==='es'?'EN':'ES';let html='';switch(state.page){case 'home':html=home();break;case 'academy':html=academy();break;case 'course':html=courseDetail(state.detail);break;case 'lesson':html=academyLessonView(state.detail);break;case 'community':html=community();break;case 'events':html=events();break;case 'event-detail':html=eventDetail();break;case 'shop':html=shop();break;case 'vip':html=vip();break;case 'teachers':html=teachers();break;case 'profile':html=profile();break;default:html=home()};document.getElementById('view').innerHTML=html;document.getElementById('bottom-nav').innerHTML=nav.map(n=>`<button class="nav-btn ${(state.page===n.id||n.id==='academy'&&['course','lesson'].includes(state.page))?'active':''}" data-page="${n.id}" ${state.page===n.id?'aria-current="page"':''}>${icon(n.icon)}<span>${tr(n.label)}</span></button>`).join('');renderOverlay()}
function renderOverlay(){const el=document.getElementById('overlay');if(!state.overlay){el.innerHTML='';return}let content='';if(state.overlay==='menu'){content=`<div class="modal drawer"><div class="top"><h2>Kizuna <span style="color:var(--red)">Rope</span></h2><button class="xbtn" data-action="close" aria-label="Cerrar">×</button></div><p class="muted">ARTE • TÉCNICA • CONEXIÓN</p>${[...nav,sections[4],{id:'profile',label:["Mi perfil","My profile"],icon:'user'}].map(x=>`<button class="menu-row" data-page="${x.id}">${icon(x.icon)} &nbsp; ${tr(x.label)}</button>`).join('')}<p class="legal-note">${tx('Comunidad 18+ · registro en línea','Community 18+ · online accounts')}</p></div>`}
else if(state.overlay==='search'){content=`<div class="modal"><div class="top"><h2>${tx('Buscar','Search')}</h2><button class="xbtn" data-action="close" aria-label="Cerrar">×</button></div><input id="search-field" placeholder="${tx('Buscar cursos o secciones…','Search courses or sections…')}" value="${esc(state.query)}" autocomplete="off" /><div id="search-results" style="margin-top:15px">${searchResults()}</div></div>`}
else if(state.overlay==='preview'){const slides=[{title:tx('Arte y conexión','Art and connection'),body:tx('Una comunidad internacional inspirada en el arte de la cuerda.','An international community inspired by rope art.')},{title:tx('Aprender con responsabilidad','Learn responsibly'),body:tx('Comunicación, seguridad y consentimiento están en el centro.','Communication, safety and consent come first.')},{title:tx('Comparte y descubre','Share and discover'),body:tx('Academia, comunidad, eventos y una experiencia premium.','Academy, community, events, and a premium experience.')}];const s=slides[state.previewSlide];content=`<div class="modal"><div class="top"><h2>${tx('Presentación del club','Club introduction')}</h2><button class="xbtn" data-action="close" aria-label="Cerrar">×</button></div><div class="preview-hero"></div><h2>${s.title}</h2><p>${s.body}</p><p class="muted">${tx('Vista previa ilustrada, no un vídeo publicado.','Illustrated preview, not a published video.')}</p><div class="form-actions"><button class="btn ghost" data-action="prev-slide">‹</button><button class="btn" data-action="next-slide">${tx('Siguiente','Next')} ›</button></div></div>`}
el.innerHTML=`<div class="shade" data-overlay="shade">${content}</div>`;if(state.overlay==='search'){const input=document.getElementById('search-field');setTimeout(()=>input?.focus(),30)}}
function searchResults(){const q=state.query.trim().toLocaleLowerCase();const rows=[...sections.map(x=>({id:x.id,title:tr(x.label),detail:tr(x.desc)})),...courses.map(x=>({id:'course',detailId:x.id,title:tr(x.title),detail:tr(x.level)}))].filter(x=>!q||`${x.title} ${x.detail}`.toLowerCase().includes(q));return rows.length?rows.map(x=>`<button class="menu-row" data-page="${x.id}" ${x.detailId?`data-id="${x.detailId}"`:''}>${esc(x.title)} <small style="color:#d3ac91">${esc(x.detail)}</small></button>`).join(''):`<p>${tx('Sin resultados','No results')}</p>`}
function decodeImage(file){return new Promise((resolve,reject)=>{if(!file){resolve('');return}if(!/^image\/(png|jpeg|webp)$/.test(file.type)){reject(new Error('format'));return}if(file.size>6*1024*1024){reject(new Error('size'));return}const fr=new FileReader();fr.onerror=()=>reject(new Error('read'));fr.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('img'));img.onload=()=>{const ratio=Math.min(1,900/img.width,900/img.height);const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*ratio));canvas.height=Math.max(1,Math.round(img.height*ratio));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.7))};img.src=fr.result};fr.readAsDataURL(file)})}
document.addEventListener('click',e=>{const node=e.target.closest('[data-page],[data-action]');if(!node){if(e.target?.dataset?.overlay==='shade'){state.overlay=null;renderOverlay()}return}if(node.dataset.page){if(node.dataset.page==='community'||node.dataset.page==='profile'){window.location.href='./community.html';return}navigate(node.dataset.page,node.dataset.id||null);return}const action=node.dataset.action;switch(action){case 'language':state.lang=state.lang==='es'?'en':'es';safeSet(i18nKey,state.lang);render();break;case 'menu':case 'search':case 'preview':state.overlay=action;state.previewSlide=0;renderOverlay();break;case 'close':state.overlay=null;renderOverlay();break;case 'next-slide':state.previewSlide=(state.previewSlide+1)%3;renderOverlay();break;case 'prev-slide':state.previewSlide=(state.previewSlide+2)%3;renderOverlay();break;case 'academy-answer':{const level=node.dataset.level,i=Number(node.dataset.lesson),choice=Number(node.dataset.choice),l=academyModules[level]?.[i];if(!l)break;if(choice===l.correct){academyMark(level,i);notify(tx('¡Correcto! Lección completada.','Correct! Lesson completed.'));render()}else notify(tx('Esa no es la respuesta. Revisa la lectura e intenta otra vez.','That is not correct. Review the lesson and try again.'));break}case 'academy-done':{const level=node.dataset.level,i=Number(node.dataset.lesson);academyMark(level,i);render();notify(tx('Lección marcada como leída en este dispositivo.','Lesson marked as read on this device.'));break}case 'favorite':{const id=node.dataset.id;const ix=state.data.favorites.indexOf(id);if(ix<0)state.data.favorites.push(id);else state.data.favorites.splice(ix,1);save();render();notify(tx('Guardados actualizados en este dispositivo.','Saved items updated on this device.'));break}case 'hide-post':state.data.hidden.push(node.dataset.id);save();render();notify(tx('Publicación oculta en este dispositivo.','Post hidden on this device.'));break;case 'clear-profile':if(!confirm(tx('¿Borrar el perfil local? No se eliminarán automáticamente las publicaciones.','Delete this local profile? Posts will not be automatically removed.')))return;state.data.profile=null;save();render();notify(tx('Perfil local borrado.','Local profile deleted.'));break;}});
document.addEventListener('input',e=>{if(e.target.id==='search-field'){state.query=e.target.value;document.getElementById('search-results').innerHTML=searchResults()}});
document.addEventListener('submit',async e=>{const form=e.target;if(!(form instanceof HTMLFormElement))return;e.preventDefault();try{if(form.id==='profile-form'){const data=new FormData(form);if(!data.get('age')||!data.get('consent')){notify(tx('Confirma edad y reglas.','Confirm age and rules.'));return}const photo=await decodeImage(form.elements.photo.files[0]);state.data.profile={nickname:String(data.get('nickname')||'').trim().slice(0,35),bio:String(data.get('bio')||'').trim().slice(0,320),photo};if(!state.data.profile.nickname)return;const ok=save();render();notify(ok?tx('Perfil de prueba guardado en este navegador.','Demo profile saved in this browser.'):tx('No se pudo guardar en este navegador.','Could not save in this browser.'))}
else if(form.id==='post-form'){if(!state.data.profile)return;const data=new FormData(form);if(!data.get('rules'))return;const body=String(data.get('body')||'').trim().slice(0,1000);if(!body)return;const photo=await decodeImage(form.elements.photo.files[0]);state.data.posts.push({id:'post-'+Date.now()+'-'+Math.floor(Math.random()*10000),author:state.data.profile.nickname,body,photo,time:Date.now(),comments:[]});const ok=save();render();notify(ok?tx('Publicación guardada solo en este dispositivo.','Post saved on this device only.'):tx('No se pudo guardar. Prueba con una imagen más pequeña.','Could not save. Try a smaller image.'))}
else if(form.id==='teacher-form'){const data=new FormData(form);state.data.interests.push({name:String(data.get('name')||'').slice(0,70),specialty:String(data.get('specialty')||'').slice(0,110),note:String(data.get('note')||'').slice(0,600),time:Date.now()});save();form.reset();notify(tx('Borrador guardado localmente; no se ha enviado.','Draft saved locally; not submitted.'))}
else if(form.classList.contains('comment-input')){if(!state.data.profile)return;const id=form.dataset.post;const post=state.data.posts.find(x=>x.id===id);if(!post)return;const comment=String(new FormData(form).get('comment')||'').trim().slice(0,350);if(!comment)return;post.comments.push({author:state.data.profile.nickname,text:comment});save();render();notify(tx('Comentario guardado localmente.','Comment saved locally.'))}}
catch(err){notify(tx('No se pudo procesar la imagen. Usa JPG, PNG o WebP de menos de 6 MB.','Could not process image. Use JPG, PNG, or WebP under 6 MB.'))}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.overlay){state.overlay=null;renderOverlay()}});
initial();
})();

</script>
</body>
</html>
